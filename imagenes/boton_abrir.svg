<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Abrir Conexiones">
<defs><style>@font-face { font-family: Mochiy; src: url(data:font/ttf;base64,) format('truetype'); }
.brilla { animation: barrido 5s ease-in-out infinite; }
.flota { animation: flotar_y 3s ease-in-out infinite alternate; transform-box: fill-box; }
.gira { animation: girar 12s linear infinite; transform-box: fill-box; transform-origin: center; }
.late { animation: latir 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.titila { animation: titilar 2.6s ease-in-out infinite; }
@keyframes barrido { 0% { transform: translateX(-120%) } 55%,100% { transform: translateX(220%) } }
@keyframes flotar_y { from { transform: translateY(-3px) } to { transform: translateY(3px) } }
@keyframes girar { to { transform: rotate(360deg) } }
@keyframes latir { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
@keyframes titilar { 0%,100% { opacity:.15 } 50% { opacity:1 } }
.menea { animation: menear 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
.petalito { animation: caer_chico linear infinite; }
@keyframes menear { 0%,70%,100% { transform: rotate(0) } 78% { transform: rotate(-10deg) } 86% { transform: rotate(9deg) } 94% { transform: rotate(-4deg) } }
@keyframes caer_chico { 0% { transform: translate(0,0) rotate(0); opacity:0 } 12% { opacity:.9 } 88% { opacity:.9 } 100% { transform: translate(-50px, var(--caida)) rotate(300deg); opacity:0 } }
@media (prefers-reduced-motion: reduce) { .brilla, .flota, .gira, .late, .titila, .menea, .petalito { animation: none; } .brilla, .petalito { opacity: 0; } }
.t { font-family: Mochiy, sans-serif; font-size: 18px; fill: url(#mezcla); }</style>
<linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FF6FAE"/><stop offset=".5" stop-color="#FFA07A"/><stop offset="1" stop-color="#FFD166"/>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="mezcla" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#FF6FAE"/><stop offset=".5" stop-color="#FFA07A"/><stop offset="1" stop-color="#FFD166"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="interior" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE2EF"/><stop offset=".5" stop-color="#FFF0EA"/><stop offset="1" stop-color="#FFF5DD"/></linearGradient>
<linearGradient id="luz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="lunares" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="2" fill="#FFFFFF" opacity=".55"/></pattern>
<clipPath id="dentro"><rect x="4" y="4" width="292" height="56" rx="28"/></clipPath>
<radialGradient id="degPetalo" cx=".5" cy="1" r="1.1">
  <stop offset="0" stop-color="#FF4F9A"/><stop offset=".35" stop-color="#FF8DC0"/><stop offset="1" stop-color="#FFFFFF"/>
</radialGradient>
<radialGradient id="degPetaloClaro" cx=".5" cy="1" r="1.1">
  <stop offset="0" stop-color="#FF8DC0"/><stop offset=".45" stop-color="#FFD6EA"/><stop offset="1" stop-color="#FFFFFF"/>
</radialGradient>
<filter id="sombraSuave" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3A1F5C" flood-opacity=".25"/>
</filter>
</defs>

<rect x="0" y="0" width="300" height="64" rx="32" fill="url(#borde)"/>
<rect x="4" y="4" width="292" height="56" rx="28" fill="url(#interior)"/>
<rect x="4" y="4" width="292" height="56" rx="28" fill="url(#lunares)"/>
<g class="flota"><circle cx="36" cy="32" r="21" fill="url(#mezcla)"/><circle cx="36" cy="32" r="17" fill="#FFFFFF"/><g class="menea"><text x="36" y="38" text-anchor="middle" style="font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:18px">✨</text></g></g>
<text class="t" x="180" y="39" text-anchor="middle">Abrir Conexiones</text>
<g clip-path="url(#dentro)"><g transform="translate(130 -12)"><g class="petalito" style="--caida:94px;animation-duration:8.8s;animation-delay:-7.7s"><path fill="url(#degPetalo)" opacity=".85" transform="scale(0.95)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(226 -12)"><g class="petalito" style="--caida:94px;animation-duration:9.4s;animation-delay:-8.8s"><path fill="url(#degPetalo)" opacity=".85" transform="scale(0.78)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(261 -12)"><g class="petalito" style="--caida:94px;animation-duration:6.7s;animation-delay:-6.1s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(1.03)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g class="brilla"><rect x="0" y="-20" width="105" height="104" fill="url(#luz)" transform="skewX(-20)" opacity=".7"/></g></g>
</svg>