<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="Mi estantería de anime">
<defs><style>
@font-face { font-family: Mochiy; src: url(data:font/ttf;base64,) format('truetype'); }

.brillo { animation: titilar 3s ease-in-out infinite; }
.cae { animation-name: caer; animation-timing-function: linear; animation-iteration-count: infinite; }
.mecer { animation: mecer 6s ease-in-out infinite alternate; }
.nube { animation: flotar 18s ease-in-out infinite alternate; }
.rayos { animation: girar 40s linear infinite; }
@keyframes titilar { 0%,100% { opacity:.2 } 50% { opacity:1 } }
@keyframes mecer { from { transform: rotate(-1.5deg) } to { transform: rotate(1.5deg) } }
@keyframes flotar { from { transform: translateX(-25px) } to { transform: translateX(25px) } }
@keyframes girar { to { transform: rotate(360deg) } }
@keyframes caer {
  0% { transform: translate(0,0) rotate(0deg); opacity:0 }
  10% { opacity:1 }
  50% { transform: translate(-60px,220px) rotate(160deg) }
  90% { opacity:1 }
  100% { transform: translate(-130px,460px) rotate(330deg); opacity:0 }
}
@media (prefers-reduced-motion: reduce) {
  .brillo, .cae, .mecer, .nube, .rayos { animation: none; }
  .cae { opacity: 0; }
}


.humo { animation: subir 4s ease-out infinite; opacity: 0; }
.llama { transform-box: fill-box; transform-origin: 50% 100%; animation: llama 1.1s ease-in-out infinite alternate; }
.brillo_lago { animation: brillar 3s ease-in-out infinite; }
@keyframes subir { 0% { transform: translate(0,0); opacity:.7 } 100% { transform: translate(14px,-70px) scale(2); opacity:0 } }
@keyframes llama { from { transform: scale(1,1) } to { transform: scale(.88,1.14) } }
@keyframes brillar { 0%,100% { opacity:.2 } 50% { opacity:.9 } }
@media (prefers-reduced-motion: reduce) { .humo, .llama, .brillo_lago { animation: none; } .humo { opacity: 0; } }

.t { font-family: Mochiy, sans-serif; font-size: 29px; fill: #FFFFFF; paint-order: stroke; stroke: #3A1F5C; stroke-opacity: .25; stroke-width: 5px; stroke-linejoin: round; }
.j { font-family: Mochiy, sans-serif; font-size: 16px; fill: #4CC9FF; letter-spacing: 3px; }

.brilla { animation: barrido 5s ease-in-out infinite; }
.flota { animation: flotar_y 3s ease-in-out infinite alternate; transform-box: fill-box; }
.gira { animation: girar 12s linear infinite; transform-box: fill-box; transform-origin: center; }
.late { animation: latir 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.titila { animation: titilar 2.6s ease-in-out infinite; }
@keyframes barrido { 0% { transform: translateX(-120%) } 55%,100% { transform: translateX(220%) } }
@keyframes flotar_y { from { transform: translateY(-3px) } to { transform: translateY(3px) } }
@keyframes girar { to { transform: rotate(360deg) } }
@keyframes latir { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
@keyframes titilar { 0%,100% { opacity:.15 } 50% { opacity:1 } }
.menea { animation: menear 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
.petalito { animation: caer_chico linear infinite; }
@keyframes menear { 0%,70%,100% { transform: rotate(0) } 78% { transform: rotate(-10deg) } 86% { transform: rotate(9deg) } 94% { transform: rotate(-4deg) } }
@keyframes caer_chico { 0% { transform: translate(0,0) rotate(0); opacity:0 } 12% { opacity:.9 } 88% { opacity:.9 } 100% { transform: translate(-50px, var(--caida)) rotate(300deg); opacity:0 } }


.petalito { animation: caer_chico linear infinite; }
.brilla { animation: barrido 5s ease-in-out infinite; }
@keyframes caer_chico { 0% { transform: translate(0,0) rotate(0); opacity:0 } 12% { opacity:.9 } 88% { opacity:.9 } 100% { transform: translate(-50px, var(--caida)) rotate(300deg); opacity:0 } }
@media (prefers-reduced-motion: reduce) { .brilla, .petalito, .crece { animation: none; } .brilla, .petalito { opacity: 0; } }
</style>
