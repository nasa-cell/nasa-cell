<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="900" height="68" role="img" aria-label="Programar es como acampar: preparas todo con calma y al final disfrutas la vista">
<defs><style>@font-face { font-family: ZenMaru; src: url(data:font/ttf;base64,) format('truetype'); }
.brilla { animation: barrido 5s ease-in-out infinite; }
.flota { animation: flotar_y 3s ease-in-out infinite alternate; transform-box: fill-box; }
.gira { animation: girar 12s linear infinite; transform-box: fill-box; transform-origin: center; }
.late { animation: latir 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.titila { animation: titilar 2.6s ease-in-out infinite; }
@keyframes barrido { 0% { transform: translateX(-120%) } 55%,100% { transform: translateX(220%) } }
@keyframes flotar_y { from { transform: translateY(-3px) } to { transform: translateY(3px) } }
@keyframes girar { to { transform: rotate(360deg) } }
@keyframes latir { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
@keyframes titilar { 0%,100% { opacity:.15 } 50% { opacity:1 } }
.menea { animation: menear 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
.petalito { animation: caer_chico linear infinite; }
@keyframes menear { 0%,70%,100% { transform: rotate(0) } 78% { transform: rotate(-10deg) } 86% { transform: rotate(9deg) } 94% { transform: rotate(-4deg) } }
@keyframes caer_chico { 0% { transform: translate(0,0) rotate(0); opacity:0 } 12% { opacity:.9 } 88% { opacity:.9 } 100% { transform: translate(-50px, var(--caida)) rotate(300deg); opacity:0 } }
@media (prefers-reduced-motion: reduce) { .brilla, .flota, .gira, .late, .titila, .menea, .petalito { animation: none; } .brilla, .petalito { opacity: 0; } }
.t { font-family: ZenMaru, sans-serif; font-size: 21px; fill: #4A2E6B; font-weight: bold; }</style>
<linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FF9F43"/><stop offset=".5" stop-color="#FF6FAE"/><stop offset="1" stop-color="#B388FF"/>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="mezcla" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#FF9F43"/><stop offset=".5" stop-color="#FF6FAE"/><stop offset="1" stop-color="#B388FF"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="interior" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFECD9"/><stop offset=".5" stop-color="#FFE8F2"/><stop offset="1" stop-color="#EEE5FF"/></linearGradient>
<linearGradient id="luz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="lunares" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="2" fill="#FFFFFF" opacity=".55"/></pattern>
<clipPath id="dentro"><rect x="4" y="4" width="892" height="60" rx="30"/></clipPath>
<radialGradient id="degPetalo" cx=".5" cy="1" r="1.1">
  <stop offset="0" stop-color="#FF4F9A"/><stop offset=".35" stop-color="#FF8DC0"/><stop offset="1" stop-color="#FFFFFF"/>
</radialGradient>
<radialGradient id="degPetaloClaro" cx=".5" cy="1" r="1.1">
  <stop offset="0" stop-color="#FF8DC0"/><stop offset=".45" stop-color="#FFD6EA"/><stop offset="1" stop-color="#FFFFFF"/>
</radialGradient>
<filter id="sombraSuave" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3A1F5C" flood-opacity=".25"/>
</filter>
</defs>

<rect x="0" y="0" width="900" height="68" rx="34" fill="url(#borde)"/>
<rect x="4" y="4" width="892" height="60" rx="30" fill="url(#interior)"/>
<rect x="4" y="4" width="892" height="60" rx="30" fill="url(#lunares)"/>
<g class="flota"><circle cx="38" cy="34" r="22" fill="url(#mezcla)"/><circle cx="38" cy="34" r="18" fill="#FFFFFF"/><g class="menea"><text x="38" y="41" text-anchor="middle" style="font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:20px">🏕️</text></g></g>
<text class="t" x="460" y="41" text-anchor="middle">Programar es como acampar: preparas todo con calma y al final disfrutas la vista</text>
<g class="gira"><g transform="translate(862 34) rotate(0) scale(0.7)" filter="url(#sombraSuave)"><path d="M0 0 C-10 -5 -13 -17 -6 -23 L0 -19.5 L6 -23 C13 -17 10 -5 0 0Z" fill="url(#degPetaloClaro)" stroke="#FF4F9A" stroke-opacity=".35" stroke-width=".8" transform="rotate(0)"/><path d="M0 0 C-10 -5 -13 -17 -6 -23 L0 -19.5 L6 -23 C13 -17 10 -5 0 0Z" fill="url(#degPetaloClaro)" stroke="#FF4F9A" stroke-opacity=".35" stroke-width=".8" transform="rotate(72)"/><path d="M0 0 C-10 -5 -13 -17 -6 -23 L0 -19.5 L6 -23 C13 -17 10 -5 0 0Z" fill="url(#degPetaloClaro)" stroke="#FF4F9A" stroke-opacity=".35" stroke-width=".8" transform="rotate(144)"/><path d="M0 0 C-10 -5 -13 -17 -6 -23 L0 -19.5 L6 -23 C13 -17 10 -5 0 0Z" fill="url(#degPetaloClaro)" stroke="#FF4F9A" stroke-opacity=".35" stroke-width=".8" transform="rotate(216)"/><path d="M0 0 C-10 -5 -13 -17 -6 -23 L0 -19.5 L6 -23 C13 -17 10 -5 0 0Z" fill="url(#degPetaloClaro)" stroke="#FF4F9A" stroke-opacity=".35" stroke-width=".8" transform="rotate(288)"/><circle r="3.2" fill="#FF4F9A"/><line x1="0" y1="0" x2="2.2" y2="-6.7" stroke="#FF4F9A" stroke-width="1"/><circle cx="2.5" cy="-7.6" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="5.7" y2="-4.1" stroke="#FF4F9A" stroke-width="1"/><circle cx="6.5" cy="-4.7" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="7.0" y2="-0.0" stroke="#FF4F9A" stroke-width="1"/><circle cx="8.0" cy="-0.0" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="5.7" y2="4.1" stroke="#FF4F9A" stroke-width="1"/><circle cx="6.5" cy="4.7" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="2.2" y2="6.7" stroke="#FF4F9A" stroke-width="1"/><circle cx="2.5" cy="7.6" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="-2.2" y2="6.7" stroke="#FF4F9A" stroke-width="1"/><circle cx="-2.5" cy="7.6" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="-5.7" y2="4.1" stroke="#FF4F9A" stroke-width="1"/><circle cx="-6.5" cy="4.7" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="-7.0" y2="0.0" stroke="#FF4F9A" stroke-width="1"/><circle cx="-8.0" cy="0.0" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="-5.7" y2="-4.1" stroke="#FF4F9A" stroke-width="1"/><circle cx="-6.5" cy="-4.7" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="-2.2" y2="-6.7" stroke="#FF4F9A" stroke-width="1"/><circle cx="-2.5" cy="-7.6" r="1.4" fill="#FFD84D"/></g></g>
<g clip-path="url(#dentro)"><g transform="translate(882 -12)"><g class="petalito" style="--caida:98px;animation-duration:7.1s;animation-delay:-2.3s"><path fill="url(#degPetalo)" opacity=".85" transform="scale(0.76)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(675 -12)"><g class="petalito" style="--caida:98px;animation-duration:8.1s;animation-delay:-0.1s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(0.77)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(216 -12)"><g class="petalito" style="--caida:98px;animation-duration:6.4s;animation-delay:-2.5s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(0.79)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(864 -12)"><g class="petalito" style="--caida:98px;animation-duration:8.0s;animation-delay:-7.5s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(0.72)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(589 -12)"><g class="petalito" style="--caida:98px;animation-duration:7.0s;animation-delay:-4.2s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(1.09)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(541 -12)"><g class="petalito" style="--caida:98px;animation-duration:7.7s;animation-delay:-2.5s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(0.86)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(783 -12)"><g class="petalito" style="--caida:98px;animation-duration:9.7s;animation-delay:-7.7s"><path fill="url(#degPetalo)" opacity=".85" transform="scale(0.72)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g transform="translate(406 -12)"><g class="petalito" style="--caida:98px;animation-duration:8.5s;animation-delay:-2.8s"><path fill="url(#degPetaloClaro)" opacity=".85" transform="scale(0.71)" d="M0 0 C-7 -4 -9 -12 -4 -16 L0 -13.5 L4 -16 C9 -12 7 -4 0 0Z"/></g></g><g class="brilla"><rect x="0" y="-20" width="315" height="108" fill="url(#luz)" transform="skewX(-20)" opacity=".7"/></g></g>
</svg>