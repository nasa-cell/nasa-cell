"0" y1="0" x2="-5.7" y2="-4.1" stroke="#FF4F9A" stroke-width="1"/><circle cx="-6.5" cy="-4.7" r="1.4" fill="#FFD84D"/><line x1="0" y1="0" x2="-2.2" y2="-6.7" stroke="#FF4F9A" stroke-width="1"/><circle cx="-2.5" cy="-7.6" r="1.4" fill="#FFD84D"/></g>
